name: Correctness and packaging
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.3
      - run: uv sync --frozen --extra octree
      - run: uv run --frozen --extra octree pytest tests -q
      - run: uv build --wheel
      - run: python scripts/check_wheel.py
      - name: Verify the installed wheel outside the checkout
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          PYTHON_BIN="$PWD/.venv/bin/python"
          cd "$(mktemp -d)"
          "$PYTHON_BIN" -I -m orbit3d.cli --help
          "$PYTHON_BIN" -I -c 'import orbit3d.generator.octree_model; from importlib.resources import files; assert files("orbit3d.compat.hyff").joinpath("checkpoints/index.json").is_file()'
