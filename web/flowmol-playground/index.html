<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MolGen-RS · Dual-Engine WebGPU Playground (FlowMol-118 + Uni-3DAR-Mol)</title>
<script>
  if (location.hostname === "0.0.0.0" || location.hostname === "::" || location.hostname === "[::]") {
    location.replace(`${location.protocol}//localhost:${location.port}${location.pathname}${location.search}`);
  }
</script>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #111827;
    --border: #1f2937;
    --fg: #e5e7eb;
    --muted: #9ca3af;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--fg);
    display: grid; grid-template-columns: 368px 1fr; height: 100vh; overflow: hidden;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 15.5px; margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1e3a8a; color: #93c5fd; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 198px; }
  .badge.warn { background: #78350f; color: #fde68a; }
  .badge.ok { background: #064e3b; color: #6ee7b7; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
  .tab-btn {
    border: none; border-radius: 6px; padding: 7px 6px; font-size: 12px; font-weight: 600;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .tab-btn.active.flow { background: #1d4ed8; color: #fff; }
  .tab-btn.active.uni { background: #6d28d9; color: #fff; }
  .group { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
  label { color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  input, select, button {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6.5px 9px; font-size: 12px; outline: none;
  }
  input[type="checkbox"] { width: 14px; height: 14px; padding: 0; accent-color: var(--accent2); }
  input:focus, select:focus { border-color: var(--accent); }
  button { cursor: pointer; font-weight: 600; transition: opacity 0.15s, border-color 0.15s; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 9px; font-size: 13px; }
  button.primary.uni-mode { background: var(--accent2); border-color: var(--accent2); }
  button.danger { background: #7f1d1d; border-color: #991b1b; color: #fecaca; padding: 9px; font-size: 13px; }
  button:disabled { opacity: 0.42; cursor: not-allowed; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prop-grid { display: flex; flex-direction: column; gap: 5px; background: rgba(11,15,25,0.55); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
  .prop-row { display: grid; grid-template-columns: 20px 1fr 92px; align-items: center; gap: 6px; font-size: 11.5px; }
  .alert {
    display: none; font-size: 11.5px; line-height: 1.45; padding: 8px 10px;
    border-radius: 6px; border: 1px solid #92400e; background: rgba(120, 53, 15, 0.35); color: #fde68a;
  }
  .alert.error { border-color: #991b1b; background: rgba(127, 29, 29, 0.35); color: #fecaca; }
  main { position: relative; display: flex; flex-direction: column; height: 100vh; }
  #topbar {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; font-family: ui-monospace, monospace;
  }
  #cv { flex: 1; width: 100%; cursor: grab; touch-action: none; }
  #cv:active { cursor: grabbing; }
  #bottombar {
    padding: 10px 16px; border-top: 1px solid var(--border); background: var(--panel);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pill { padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); }
  .pill.uni { border-color: #5b21b6; color: #ddd6fe; }
</style>
</head>
<body>
<aside>
  <div>
    <h1>MolGen-RS <span class="badge" id="gpuTag">Worker Init...</span></h1>
    <div style="font-size:11px;color:var(--muted);margin-top:3px;">端侧统一 Rust + WebGPU 双引擎三维分子生成工作台</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active flow" id="tabFlow">🌊 FlowMol-118</button>
    <button class="tab-btn uni" id="tabUni">🌲 Uni-3DAR-Mol</button>
  </div>

  <div id="diagBox" class="alert"></div>

  <div class="group">
    <label><span id="lblModelTitle">1. 加载模型包 (.fm118 / .u3m)</span><span id="modelState" class="mono">未加载</span></label>
    <div style="display:grid;grid-template-columns:1fr auto;gap:6px;">
      <select id="selPresetUrl"></select>
      <button id="btnFetchDefault">加载</button>
    </div>
    <input type="file" id="fileInput" accept=".fm118,.u3m" />
  </div>

  <!-- ================= Engine 1: FlowMol-118 Controls ================= -->
  <div id="panelFlow" style="display:flex;flex-direction:column;gap:11px;">
    <div class="group">
      <label><span>目标化学域</span><span>元素白名单 + 尺寸分布</span></label>
      <select id="selDomain">
        <option value="geom_drugs">GEOM-Drugs (类药分子)</option>
        <option value="qm9">QM9 (小分子 H/C/N/O/F)</option>
        <option value="oe62">OE62 (有机光电材料)</option>
        <option value="tmqm">tmQM (过渡金属配合物)</option>
        <option value="open118">Open-118 (全周期表无掩码)</option>
      </select>
    </div>

    <div class="row2">
      <div class="group">
        <label><span>原子数 N (0=自动)</span></label>
        <input type="number" id="inpAtoms" value="32" min="0" max="120" class="mono" />
      </div>
      <div class="group">
        <label><span>采样步数</span></label>
        <input type="number" id="inpSteps" value="20" min="5" max="150" class="mono" />
      </div>
    </div>

    <div class="row2">
      <div class="group">
        <label><span>ODE/CTMC 求解器</span></label>
        <select id="selSolver">
          <option value="heun">Heun (2阶高合法率)</option>
          <option value="euler">Euler (1阶2倍速)</option>
        </select>
      </div>
      <div class="group">
        <label><span>电荷白名单</span></label>
        <select id="selCharges">
          <option value="-1,0,1,2">常规 [-1..+2]</option>
          <option value="0">严格中性 [0]</option>
          <option value="">不限制</option>
        </select>
      </div>
    </div>

    <div class="group">
      <label><span>单分子连通保障</span><span>防孤立碎片</span></label>
      <select id="selSingleMode">
        <option value="largest_fragment">凝聚引导 + 提取主分子 (100%单分子 · 零额外耗时)</option>
        <option value="strict_retry">凝聚引导 + 自动重采 (100%单分子 · 固定原子数N)</option>
        <option value="valid_connected">严选模式 (重采至 单连通 + 价态合法)</option>
        <option value="cohesion">仅开启三维孤岛凝聚引导 (>2.8Å拉回)</option>
        <option value="none">关闭约束 (原始分布)</option>
      </select>
    </div>

    <div class="group">
      <label><span>强制出现元素 (零重训钉死)</span><span class="mono">逗号分隔</span></label>
      <input type="text" id="inpRequire" placeholder="例如: Rh,P,P 或 Ru,P,P,S" class="mono" />
    </div>
  </div>

  <!-- ================= Engine 2: Uni-3DAR-Mol Controls ================= -->
  <div id="panelUni" style="display:none;flex-direction:column;gap:11px;">
    <div class="row2">
      <div class="group">
        <label><span>目标原子预算 (0=自由)</span></label>
        <input type="number" id="inpUniBudget" value="28" min="0" max="120" class="mono" />
      </div>
      <div class="group">
        <label><span>CFG 条件引导强度</span></label>
        <input type="number" id="inpUniCfg" value="2.0" step="0.25" min="1.0" max="6.0" class="mono" />
      </div>
    </div>

    <div class="group">
      <label><span>双阶段投机八叉树漏斗 (Speculative K)</span><span>Stage1→2→1</span></label>
      <select id="selUniSpecK">
        <option value="2">K = 2 (8 → 2 → 1 · 双阶段 Critic 剪枝 · 推荐)</option>
        <option value="1">K = 1 (1 → 1 → 1 · 单路极速自回归直出)</option>
        <option value="3">K = 3 (12 → 3 → 1 · 深度属性/合法性优选)</option>
        <option value="4">K = 4 (16 → 4 → 1 · 高强度多分支搜索)</option>
      </select>
    </div>

    <div class="group">
      <label><span>几何精修与零位移价态调和</span><span>RMSD_heavy = 0 Å</span></label>
      <select id="selUniPost">
        <option value="full">开启 SE(3) Seam Refiner + ValenceReconciler (推荐)</option>
        <option value="refiner_only">仅开启 SE(3) Seam Refiner (保留原始点云氢)</option>
        <option value="raw">关闭后处理 (原始 0.01 Å 八叉树叶节点输出)</option>
      </select>
    </div>

    <div class="group" id="uniCondWrap" style="display:none;">
      <label><span>LoomConditioner 定向属性目标</span><span class="mono">勾选激活</span></label>
      <div class="prop-grid" id="uniPropList"></div>
    </div>
  </div>

  <div class="group">
    <label><span>随机种子 Seed</span><span id="loadedEngineHint" class="mono">未加载</span></label>
    <input type="number" id="inpSeed" value="42" class="mono" />
  </div>

  <div style="display:flex;gap:8px;">
    <button class="primary" id="btnSample" style="flex:1;" disabled>⚡ 开始 WebGPU 3D 生成</button>
    <button class="danger" id="btnCancel" style="display:none;">⏹ 停止</button>
  </div>

  <div class="row2">
    <button id="btnSdf" disabled>下载 .SDF</button>
    <button id="btnToggleH">显隐 H: 开</button>
  </div>
</aside>

<main>
  <div id="topbar">
    <span id="statusTxt">正在启动后台 Web Worker...</span>
    <span id="perfTxt" style="color:var(--ok);"></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="bottombar">
    <div id="molMeta" class="mono">—</div>
    <div id="extraMeta" class="mono" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>
</main>

<script type="module">
const ATOMS = [
  "H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca",
  "Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr",
  "Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","La","Ce","Pr","Nd",
  "Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu","Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg",
  "Tl","Pb","Bi","Po","At","Rn","Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm",
  "Md","No","Lr","Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"
];
const CPK = { H:"#cbd5e1", B:"#f472b6", C:"#64748b", N:"#3b82f6", O:"#ef4444", S:"#eab308", P:"#f97316", Si:"#fb923c", Se:"#d97706", F:"#4ade80", Cl:"#22c55e", Br:"#b45309", I:"#a855f7", Rh:"#14b8a6", Ru:"#8b5cf6", Ni:"#10b981", Pd:"#06b6d4", Pt:"#38bdf8", Fe:"#f97316", Cu:"#ea580c" };

const PRESETS = {
  flowmol: [
    { url: "./models/flagship_q8.fm118", label: "FlowMol 旗舰轻量 Q8_0 (46 MB · 推荐)" },
    { url: "./models/model.fm118",       label: "FlowMol 旗舰半精度 FP16 (82 MB)" },
    { url: "./models/flagship_fp32.fm118", label: "FlowMol 旗舰全精度 FP32 (161 MB)" },
  ],
  uni3dar: [
    { url: "./models/geom_drugs_q4.u3m", label: "Uni-3DAR-Mol · GEOM-Drugs Q4_0 (92 MB · 推荐)" },
    { url: "./models/geom_drugs_q8.u3m", label: "Uni-3DAR-Mol · GEOM-Drugs Q8_0 (148 MB · 高精度)" },
    { url: "./models/oe62_homo_q4.u3m",  label: "Uni-3DAR-Mol · OE62 HOMO 定向 Q4_0 (97 MB)" },
    { url: "./models/qm9_k6_q4.u3m",     label: "Uni-3DAR-Mol · QM9 六属性条件 Q4_0 (106 MB)" },
  ],
};

const gpuTag = document.getElementById("gpuTag");
const diagBox = document.getElementById("diagBox");
const statusTxt = document.getElementById("statusTxt");
const perfTxt = document.getElementById("perfTxt");
const modelState = document.getElementById("modelState");
const loadedEngineHint = document.getElementById("loadedEngineHint");
const selPresetUrl = document.getElementById("selPresetUrl");
const btnFetch = document.getElementById("btnFetchDefault");
const fileInput = document.getElementById("fileInput");
const btnSample = document.getElementById("btnSample");
const btnCancel = document.getElementById("btnCancel");
const btnSdf = document.getElementById("btnSdf");
const tabFlow = document.getElementById("tabFlow");
const tabUni = document.getElementById("tabUni");
const panelFlow = document.getElementById("panelFlow");
const panelUni = document.getElementById("panelUni");
const uniCondWrap = document.getElementById("uniCondWrap");
const uniPropList = document.getElementById("uniPropList");

let activeTab = "flowmol";     // UI tab selected
let loadedFamily = null;       // Family of the currently loaded model in Worker
let loadedInfo = null;
let worker = null;
let reqId = 1;
let modelLoaded = false;
let busy = false;
let lastLoadSpec = null;
let lastSdf = "";
let curMol = null;
let showH = true, rotY = 0.5, rotX = 0.25, zoom = 1.0, dragging = false, lx = 0, ly = 0, spinning = true;

function switchTab(family, populatePresets = true) {
  activeTab = family;
  const isUni = family === "uni3dar";
  tabFlow.classList.toggle("active", !isUni);
  tabUni.classList.toggle("active", isUni);
  panelFlow.style.display = isUni ? "none" : "flex";
  panelUni.style.display = isUni ? "flex" : "none";
  btnSample.classList.toggle("uni-mode", isUni);
  btnSample.textContent = isUni ? "🌲 开始 Uni-3DAR-Mol 生成" : "⚡ 开始 FlowMol-118 生成";
  if (populatePresets) {
    selPresetUrl.innerHTML = PRESETS[family]
      .map(p => `<option value="${p.url}">${p.label}</option>`)
      .join("");
  }
  btnSample.disabled = busy || !modelLoaded || (loadedFamily !== activeTab);
  if (modelLoaded && loadedFamily !== activeTab) {
    statusTxt.textContent = `已切换至 ${isUni ? "Uni-3DAR-Mol" : "FlowMol-118"} 面板，请点击「加载」载入对应模型`;
  }
}

switchTab("flowmol", true);
tabFlow.onclick = () => switchTab("flowmol", true);
tabUni.onclick = () => switchTab("uni3dar", true);

function buildUniCondInputs(info) {
  const cols = info.target_cols || [];
  const units = info.target_units || [];
  const means = info.target_mean || [];
  if (!cols.length || !info.has_conditioner) {
    uniCondWrap.style.display = "none";
    uniPropList.innerHTML = "";
    return;
  }
  uniCondWrap.style.display = "flex";
  // If single property (e.g. homo on OE62), check by default unless it's `sa_score` on unconditional GEOM-Drugs
  uniPropList.innerHTML = cols.map((col, idx) => {
    const unit = units[idx] ? ` (${units[idx]})` : "";
    const defVal = typeof means[idx] === "number" ? Number(means[idx].toFixed(2)) : 0;
    const defaultChecked = !(cols.length === 1 && col === "sa_score") && idx < 2;
    return `<div class="prop-row">
      <input type="checkbox" class="uni-prop-chk" data-idx="${idx}" ${defaultChecked ? "checked" : ""} />
      <span class="mono">${col}${unit}</span>
      <input type="number" step="0.1" class="mono uni-prop-val" data-idx="${idx}" value="${defVal}" />
    </div>`;
  }).join("");
}

function showDiag(text, isError = false) {
  if (!text) {
    diagBox.style.display = "none";
    diagBox.textContent = "";
    diagBox.classList.remove("error");
    return;
  }
  diagBox.textContent = text;
  diagBox.classList.toggle("error", isError);
  diagBox.style.display = "block";
}

function setBusyState(isBusy, isSampling = false) {
  busy = isBusy;
  btnFetch.disabled = isBusy;
  fileInput.disabled = isBusy;
  tabFlow.disabled = isBusy;
  tabUni.disabled = isBusy;
  btnSample.disabled = isBusy || !modelLoaded || (loadedFamily !== activeTab);
  btnCancel.style.display = isSampling ? "inline-block" : "none";
}

function spawnWorker() {
  if (worker) {
    worker.terminate();
  }
  modelLoaded = false;
  loadedFamily = null;
  worker = new Worker("./worker.js?v=6", { type: "module" });
  worker.onerror = (ev) => {
    showDiag(`Worker 运行异常: ${ev.message || "未知错误"}`, true);
    statusTxt.textContent = "Worker 发生异常";
    setBusyState(false, false);
  };
  worker.onmessage = (ev) => {
    const msg = ev.data || {};
    if (msg.type === "inited") {
      if (msg.hasWebGPU) {
        gpuTag.textContent = "WebGPU Ready";
        gpuTag.className = "badge ok";
        statusTxt.textContent = "选择引擎与预设模型后点击「加载」，或拖入本地 .fm118 / .u3m 文件";
      } else {
        gpuTag.textContent = "WASM CPU Fallback";
        gpuTag.className = "badge warn";
        showDiag(
          msg.isSecure
            ? "当前浏览器未开启 WebGPU，将使用后台 Worker CPU 推理（不会卡死页面）"
            : "当前地址非安全上下文，浏览器禁用了 WebGPU；请改用 http://localhost:8080 访问！"
        );
        statusTxt.textContent = "WebGPU 未启用 (CPU Worker 就绪)";
      }
      return;
    }

    if (msg.type === "download_progress") {
      const pct = ((msg.loaded / msg.total) * 100).toFixed(0);
      statusTxt.textContent = `正在下载模型: ${(msg.loaded / 1e6).toFixed(1)} / ${(msg.total / 1e6).toFixed(1)} MB (${pct}%)...`;
      return;
    }

    if (msg.type === "status") {
      statusTxt.textContent = msg.text;
      return;
    }

    if (msg.type === "loaded") {
      const info = msg.info;
      const isGpu = info.is_gpu ?? String(info.backend || "").startsWith("wgpu/");
      modelLoaded = true;
      loadedFamily = info.engine_family;
      loadedInfo = info;
      if (activeTab !== loadedFamily) {
        switchTab(loadedFamily, true);
      }
      gpuTag.textContent = info.backend;
      gpuTag.className = isGpu ? "badge ok" : "badge warn";
      loadedEngineHint.textContent = loadedFamily === "uni3dar" ? "Uni-3DAR-Mol 就绪" : "FlowMol-118 就绪";

      if (loadedFamily === "uni3dar") {
        modelState.textContent = `${info.quant_dtype} · L=${info.num_layers}/M${info.merge_level} (${info.size_mb}MB)`;
        buildUniCondInputs(info);
        if (Array.isArray(info.target_cols) && info.target_cols.includes("alpha")) {
          document.getElementById("inpUniBudget").value = "18";
        } else if ( document.getElementById("inpUniBudget").value === "18" ) {
          document.getElementById("inpUniBudget").value = "28";
        }
      } else {
        modelState.textContent = `${info.quant_dtype} · L=${info.n_molecule_updates} (${info.size_mb}MB)`;
      }

      statusTxt.textContent = `已就绪: ${msg.label} (初始化 ${info.load_ms.toFixed(0)} ms)`;
      if (!isGpu) {
        showDiag(`未启用 WebGPU 硬件加速 (${info.gpu_error || "已降级至 CPU Worker"})。`);
      } else {
        showDiag("");
      }
      setBusyState(false, false);
      return;
    }

    if (msg.type === "step") {
      const { step, total, xFlat, aIdx, engineFamily } = msg;
      const n = aIdx.length;
      const pos = new Array(n);
      const syms = new Array(n);
      for (let i = 0; i < n; i++) {
        pos[i] = [xFlat[3 * i], xFlat[3 * i + 1], xFlat[3 * i + 2]];
        syms[i] = aIdx[i] < ATOMS.length ? ATOMS[aIdx[i]] : "?";
      }
      curMol = { positions: pos, symbols: syms, bonds: [] };
      statusTxt.textContent = engineFamily === "uni3dar"
        ? `八叉树体素→原子自回归生长 ${step} / ${total}...`
        : `连续流匹配去噪步 ${step} / ${total}...`;
      draw();
      return;
    }

    if (msg.type === "sampled") {
      const dt = msg.elapsedMs;
      const parsed = JSON.parse(msg.resStr);
      const m = parsed.molecule;
      lastSdf = parsed.sdf;
      curMol = { positions: m.positions, symbols: m.atom_symbols, bonds: m.bonds };
      spinning = true;
      btnSdf.disabled = false;
      const seedEl = document.getElementById("inpSeed");
      seedEl.value = String((parseInt(seedEl.value || "42", 10) || 42) + 1);
      statusTxt.textContent = `生成完成: ${m.formula}`;
      perfTxt.textContent = `${dt.toFixed(0)} ms (${(1000 / dt).toFixed(2)} mol/s)`;

      if (msg.engineFamily === "uni3dar") {
        const fSpec = Array.isArray(m.funnel_spec) ? `${m.funnel_spec[0]}→${m.funnel_spec[1]}→1` : "1→1";
        document.getElementById("molMeta").textContent =
          `${m.formula} · N=${m.n_atoms} (重原子 ${m.n_heavy}) · 合法=${m.valence_valid} · 单连通=${m.connected} · 调和=${m.reconcile_status} (RMSD=${(m.heavy_rmsd_a || 0).toFixed(3)}Å) · 漏斗=${fSpec}`;
        const props = m.predicted_props || {};
        const propPills = Object.entries(props).map(([k, v]) =>
          `<span class="pill uni">Critic ${k}: ${Number(v).toFixed(3)}</span>`
        );
        if (typeof m.stage2_utility === "number") {
          propPills.push(`<span class="pill uni">U2=${m.stage2_utility.toFixed(2)}</span>`);
        }
        document.getElementById("extraMeta").innerHTML = propPills.join("");
      } else {
        document.getElementById("molMeta").textContent =
          `${m.formula} · N=${m.n_atoms} (重原子 ${m.n_heavy}) · 价态合法=${m.valence_valid} · 单连通=${m.connected} (${m.n_fragments} frag) · d_min=${m.min_dist.toFixed(3)} Å`;
        document.getElementById("extraMeta").innerHTML = (m.metals || []).map(mc =>
          `<span class="pill">${mc.symbol} (CN=${mc.coordination_number}): ${mc.neighbors.map(nb => `${nb.symbol} ${nb.distance.toFixed(2)}Å`).join(", ")}</span>`
        ).join("");
      }
      setBusyState(false, false);
      draw();
      return;
    }

    if (msg.type === "error") {
      showDiag(msg.error, true);
      statusTxt.textContent = `失败: ${msg.error}`;
      setBusyState(false, false);
    }
  };
  worker.postMessage({ type: "init" });
}

spawnWorker();

btnFetch.onclick = () => {
  if (busy) return;
  showDiag("");
  const url = selPresetUrl.value;
  const spec = { type: "load_url", id: ++reqId, url, cacheKey: "molgen_" + url.split("/").pop(), useGpu: true };
  lastLoadSpec = spec;
  setBusyState(true, false);
  worker.postMessage(spec);
};

fileInput.onchange = (e) => {
  const f = e.target.files[0];
  if (!f || busy) return;
  showDiag("");
  const spec = { type: "load_file", id: ++reqId, file: f, useGpu: true };
  lastLoadSpec = spec;
  setBusyState(true, false);
  worker.postMessage(spec);
};

btnSample.onclick = () => {
  if (!modelLoaded || busy || loadedFamily !== activeTab) return;
  showDiag("");
  spinning = false;
  perfTxt.textContent = "";
  const seed = parseInt(document.getElementById("inpSeed").value || "42", 10);

  let opts;
  if (loadedFamily === "uni3dar") {
    const bVal = parseInt(document.getElementById("inpUniBudget").value || "0", 10);
    const postMode = document.getElementById("selUniPost").value;
    const chks = Array.from(document.querySelectorAll(".uni-prop-chk"));
    const vals = Array.from(document.querySelectorAll(".uni-prop-val"));
    let condTargets = null;
    let condActive = null;
    if (chks.length > 0) {
      condActive = chks.map(c => !!c.checked);
      condTargets = vals.map(v => parseFloat(v.value || "0") || 0.0);
    }
    opts = {
      budget_atoms: bVal > 1 ? bVal : null,
      speculative_scale: parseInt(document.getElementById("selUniSpecK").value || "2", 10),
      cfg_scale: parseFloat(document.getElementById("inpUniCfg").value || "2.0") || 2.0,
      use_refiner: postMode !== "raw",
      reconcile_valence: postMode === "full",
      single_molecule_mode: "largest_fragment",
      cond_targets: condTargets,
      cond_active: condActive,
      seed,
    };
    statusTxt.textContent = "正在启动 Uni-3DAR-Mol 八叉树投机解码...";
  } else {
    const nVal = parseInt(document.getElementById("inpAtoms").value || "0", 10);
    const reqRaw = document.getElementById("inpRequire").value.trim();
    const chgRaw = document.getElementById("selCharges").value.trim();
    opts = {
      n_atoms: nVal > 1 ? nVal : null,
      domain: document.getElementById("selDomain").value,
      n_steps: Math.max(5, parseInt(document.getElementById("inpSteps").value || "20", 10)),
      solver: document.getElementById("selSolver").value,
      grid_type: "quadratic_end",
      single_molecule_mode: document.getElementById("selSingleMode").value,
      max_retries: 4,
      required_elements: reqRaw ? reqRaw.split(",").map(s => s.trim()).filter(Boolean) : [],
      allowed_charges: chgRaw ? chgRaw.split(",").map(s => parseInt(s.trim(), 10)) : null,
      seed,
    };
    statusTxt.textContent = "正在提交 FlowMol-118 首个去噪步...";
  }

  setBusyState(true, true);
  worker.postMessage({ type: "sample", id: ++reqId, optsJson: JSON.stringify(opts) });
};

btnCancel.onclick = () => {
  statusTxt.textContent = "已中止当前生成，正在恢复模型就绪状态...";
  spawnWorker();
  if (lastLoadSpec) {
    lastLoadSpec.id = ++reqId;
    setBusyState(true, false);
    worker.postMessage(lastLoadSpec);
  } else {
    setBusyState(false, false);
  }
};

btnSdf.onclick = () => {
  if (!lastSdf) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lastSdf], { type: "chemical/x-mdl-sdfile" }));
  a.download = loadedFamily === "uni3dar" ? "uni3dar_mol_generated.sdf" : "flowmol_generated.sdf";
  a.click();
};

document.getElementById("btnToggleH").onclick = (e) => {
  showH = !showH;
  e.target.textContent = `显隐 H: ${showH ? "开" : "关"}`;
  draw();
};

const cv = document.getElementById("cv");
cv.addEventListener("pointerdown", e => { dragging = true; spinning = false; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  rotY += (e.clientX - lx) * 0.01;
  rotX = Math.max(-1.45, Math.min(1.45, rotX + (e.clientY - ly) * 0.01));
  lx = e.clientX; ly = e.clientY; draw();
});
cv.addEventListener("pointerup", () => { dragging = false; });
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.5, Math.min(2.4, zoom * (e.deltaY > 0 ? 0.92 : 1.08))); draw(); }, { passive: false });

function draw() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(300, Math.floor(r.width)), H = Math.max(240, Math.floor(r.height));
  if (cv.width !== W * dpr || cv.height !== H * dpr) {
    cv.width = W * dpr; cv.height = H * dpr;
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!curMol || !curMol.positions.length) return;

  const pos = curMol.positions, syms = curMol.symbols;
  let maxR = 1.5;
  for (let i = 0; i < pos.length; i++) {
    const p = pos[i];
    const rr = Math.hypot(p[0], p[1], p[2]);
    if (rr > maxR) maxR = rr;
  }
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  const sc = (Math.min(W, H) * 0.38 / maxR) * zoom, camZ = maxR * 3.8;

  const proj = pos.map((p, i) => {
    const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
    const y2 = p[1] * cx - z1 * sx, z2 = p[1] * sx + z1 * cx;
    const pr = camZ / Math.max(camZ - z2, 1.0);
    return { sym: syms[i], sx: W / 2 + x1 * sc * pr, sy: H / 2 - y2 * sc * pr, z: z2, p: pr };
  });

  const items = [];
  (curMol.bonds || []).forEach(b => {
    if (!proj[b.u] || !proj[b.v]) return;
    if (!showH && (proj[b.u].sym === "H" || proj[b.v].sym === "H")) return;
    items.push({ t: "b", u: proj[b.u], v: proj[b.v], bt: b.bond_type_id, z: (proj[b.u].z + proj[b.v].z) / 2 });
  });
  proj.forEach(p => {
    if (!showH && p.sym === "H") return;
    items.push({ t: "a", a: p, z: p.z });
  });
  items.sort((a, b) => a.z - b.z);

  items.forEach(it => {
    if (it.t === "b") {
      ctx.save();
      const pAvg = (it.u.p + it.v.p) / 2;
      const dx = it.v.sx - it.u.sx, dy = it.v.sy - it.u.sy;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      ctx.strokeStyle = it.bt === 5 ? "#f59e0b" : "#94a3b8";
      if (it.bt === 5) ctx.setLineDash([5, 4]);
      if (it.bt === 2) {
        ctx.lineWidth = 1.8 * pAvg;
        const off = 2.2 * pAvg;
        ctx.beginPath();
        ctx.moveTo(it.u.sx + nx * off, it.u.sy + ny * off);
        ctx.lineTo(it.v.sx + nx * off, it.v.sy + ny * off);
        ctx.moveTo(it.u.sx - nx * off, it.u.sy - ny * off);
        ctx.lineTo(it.v.sx - nx * off, it.v.sy - ny * off);
        ctx.stroke();
      } else if (it.bt === 3) {
        ctx.lineWidth = 1.6 * pAvg;
        const off = 3.0 * pAvg;
        ctx.beginPath();
        ctx.moveTo(it.u.sx, it.u.sy); ctx.lineTo(it.v.sx, it.v.sy);
        ctx.moveTo(it.u.sx + nx * off, it.u.sy + ny * off); ctx.lineTo(it.v.sx + nx * off, it.v.sy + ny * off);
        ctx.moveTo(it.u.sx - nx * off, it.u.sy - ny * off); ctx.lineTo(it.v.sx - nx * off, it.v.sy - ny * off);
        ctx.stroke();
      } else {
        ctx.lineWidth = 2.2 * pAvg;
        ctx.beginPath(); ctx.moveTo(it.u.sx, it.u.sy); ctx.lineTo(it.v.sx, it.v.sy); ctx.stroke();
      }
      ctx.restore();
    } else {
      const p = it.a;
      const rad = (p.sym === "H" ? 4.5 : (p.sym === "?" ? 5.5 : 9.5)) * p.p * Math.min(1.3, zoom);
      const col = p.sym === "?" ? "#475569" : (CPK[p.sym] || "#a855f7");
      const g = ctx.createRadialGradient(p.sx - rad * 0.3, p.sy - rad * 0.3, rad * 0.1, p.sx, p.sy, rad);
      g.addColorStop(0, "#fff"); g.addColorStop(0.35, col); g.addColorStop(1, "#020617");
      ctx.beginPath(); ctx.arc(p.sx, p.sy, rad, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
      if (p.sym !== "C" && p.sym !== "H" && p.sym !== "?") {
        ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(p.sym, p.sx, p.sy + 0.5);
      }
    }
  });
}

function anim() {
  if (spinning && !dragging && curMol) { rotY += 0.008; draw(); }
  requestAnimationFrame(anim);
}
new ResizeObserver(draw).observe(cv);
requestAnimationFrame(anim);
</script>
</body>
</html>
