[package]
name = "loom-rs"
version = "0.1.0"
edition = "2021"
description = "Unified client-side Rust + wgpu (Desktop Metal/Vulkan/DX12 + Browser WASM/WebGPU) engine for Uni-Loom v2.0: Oracle Training & GP Calibration, Declarative Weaving, LoRA SFT, XYZ Distillation, Online TopoGRPO, and Grounded RSI"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loom-cli"
path = "src/bin/loom_cli.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
half = "2.4"
mlip-core = { path = "../mlip-core" }
hyff-rs = { path = "../hyff-rs" }
dpa4-rs = { path = "../dpa4-rs" }
uni3dar-rs = { path = "../uni3dar-rs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "24.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
