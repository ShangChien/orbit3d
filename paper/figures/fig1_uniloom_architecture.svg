<title id="title">Uni-Loom architecture</title>
<desc id="desc">External property models, differentiable 3D predictors, and MLIPs plug into a declarative Critic Bus without retraining. The five-stage forward pipeline (Weaving spec, Octree policy, Neutral graph, Critic bus, 4-zone atlas) feeds trusted intervals to scale-decoupled inner RSI and frozen blindspots to outer-loop DFT acquisition and zero-retrain Bayesian residual calibration.</desc>
