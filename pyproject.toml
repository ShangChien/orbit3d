[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "orbit3d"
version = "1.0.0"
description = "ORBIT-3D: Octree-Based Reinforced Bidirectional Interval-Targeted 3D Molecular Generation with Pluggable Quantum-Mechanical Oracles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ORBIT-3D Team" }
]
keywords = [
    "3d-molecular-generation",
    "octree-autoregression",
    "uni-3dar",
    "grpo",
    "dpa-4",
    "unimol",
    "uni-qsar",
    "mlip"
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "torch>=2.2.0",
    "rdkit>=2022.9.5",
    "ase>=3.22.0",
]

[project.optional-dependencies]
deepmd = [
    "deepmd-kit>=3.0.0b4",
]
hyff = [
    "safetensors>=0.4.0",
    "triton>=3.3.0",
    "warp-lang==1.10.1",
    "nvalchemi-toolkit-ops==0.3.1",
]
baselines = [
    "lightning>=2.1.0",
    "einops>=0.7.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
orbit3d = "orbit3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit3d"]

[tool.uv]
managed = true
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
baselines = [
    "matplotlib>=3.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "benchmarks", "scripts"]
