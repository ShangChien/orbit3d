[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "orbit3d"
version = "1.0.0"
description = "ORBIT-3D: Octree-Based Reinforced Bidirectional Interval-Targeted 3D Molecular Generation with Pluggable Quantum-Mechanical Oracles"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Shangqian Chen", email = "chensq@dp.tech" },
    { name = "Guojiang Zhao" },
    { name = "Zheng Cheng" },
    { name = "Jiankun Wang" },
    { name = "Hongshuai Wang" },
    { name = "Zhifeng Gao" }
]
keywords = [
    "3d-molecular-generation",
    "octree-autoregression",
    "uni-3dar",
    "grpo",
    "dpa-4",
    "hyff",
    "unimol",
    "uni-qsar",
    "mlip"
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "torch==2.7.1",
    "rdkit>=2022.9.5",
    "ase>=3.22.0",
]

[project.optional-dependencies]
quantum = ["pyscf==2.12.1", "geometric==1.1"]
quantum-gpu = [
    "pyscf==2.12.1", "geometric==1.1",
    "gpu4pyscf-cuda12x==1.9.1; sys_platform == 'linux'",
    "gpu4pyscf-libxc-cuda12x==0.9.0; sys_platform == 'linux'",
    "cupy-cuda12x==13.4.1; sys_platform == 'linux'",
    "cutensor-cu12==2.2.0; sys_platform == 'linux'",
]
octree = ["lmdb>=1.4", "numba>=0.59", "tqdm>=4.66"]
deepmd = [
    "deepmd-kit==3.2.0",
    "e3nn==0.5.9",
    "warp-lang==1.10.1",
    "nvalchemi-toolkit-ops==0.3.1; sys_platform == 'linux'",
    "vesin[torch]; sys_platform != 'linux'",
]
hyff = [
    "safetensors>=0.4.0",
    "triton>=3.3.0; sys_platform == 'linux'",
    "warp-lang==1.10.1",
    "nvalchemi-toolkit-ops==0.3.1; sys_platform == 'linux'",
]
baselines = [
    "lightning>=2.1.0",
    "einops>=0.7.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
orbit3d = "orbit3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit3d"]

[tool.uv]
managed = true
package = true
default-groups = ["dev"]
# PyPI's 3.2.0 C++ wheel targets Torch 2.11. Use the supported Python
# PyTorch backend with our pinned Torch; DPA inference still runs on CUDA.
no-binary-package = ["deepmd-kit"]

[tool.uv.extra-build-variables]
deepmd-kit = { DP_ENABLE_TENSORFLOW = "0", DP_ENABLE_PYTORCH = "0" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
baselines = [
    "matplotlib>=3.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "benchmarks", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
